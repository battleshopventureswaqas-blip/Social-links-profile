<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Social links profile</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="contact">
    <img src="assets/images/avatar-jessica.jpeg" alt="Jessica Randall profile picture">
    <h1>Jessica Randall</h1>
    <h2>London, United Kingdom</h2>
    <p>"Front-end developer and avid reader."</p>
    
    <div class="links">
      <a href="https://github.com/" target="_blank" class="btn">GitHub</a>
      <a href="https://www.frontendmentor.io/" target="_blank" class="btn">Frontend Mentor</a>
      <a href="https://www.linkedin.com/" target="_blank" class="btn">LinkedIn</a>
      <a href="https://twitter.com/" target="_blank" class="btn">Twitter</a>
      <a href="https://www.instagram.com/" target="_blank" class="btn">Instagram</a>
    </div>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Waqas</a>.
  </footer>
</body>
</html>
